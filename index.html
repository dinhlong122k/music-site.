<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!--
    CSP: mọi thứ chỉ tải/kết nối trong CÙNG domain ('self').
    Đây chính là điều giúp vượt tường lửa: trang không gọi ra youtube.com hay googleapis.com nữa.
    - connect-src 'self': fetch chỉ tới /api/* của chính site.
    - media-src 'self': thẻ <audio> chỉ phát từ /api/proxy (cùng domain).
    - img-src 'self' data: : không tải ảnh bìa từ host ngoài.
    - Không có 'unsafe-inline', 'unsafe-eval' hay dấu * ở bất kỳ nguồn nào.
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
  <title>Nghe nhạc</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Thanh trên cùng: tên site -->
  <header class="topbar">
    <h1>Nghe nhạc</h1>
  </header>

  <!-- Vùng thông báo lỗi/trạng thái (đọc được bằng trình đọc màn hình) -->
  <p id="status" class="status" role="status" aria-live="polite"></p>

  <!-- Giao diện chính, hai cột -->
  <main id="main-screen" class="layout">
    <!-- Cột trái: nhập playlist, tìm bài, kết quả -->
    <section class="column">
      <form id="playlist-form" class="row">
        <label for="playlist-input" class="visually-hidden">Link playlist</label>
        <input id="playlist-input" type="text" autocomplete="off" placeholder="Dán link playlist YouTube...">
        <button id="playlist-button" type="submit">Tải</button>
      </form>
      <form id="search-form" class="row">
        <label for="search-input" class="visually-hidden">Tìm bài hát</label>
        <input id="search-input" type="text" autocomplete="off" placeholder="Tìm bài hát...">
        <button id="search-button" type="submit">Tìm</button>
      </form>

      <h2>Kết quả tìm kiếm</h2>
      <p id="search-empty" class="hint">Chưa có kết quả. Hãy gõ tên bài và bấm Tìm.</p>
      <ul id="search-results" class="list"></ul>
    </section>

    <!-- Cột phải: trình phát, nút điều khiển, danh sách đang phát -->
    <section class="column">
      <!-- Trình phát: thẻ audio cùng domain (nguồn là /api/proxy). controls có sẵn thanh tua. -->
      <audio id="audio-player" class="audio-player" controls preload="none"></audio>
      <div class="controls">
        <button id="prev-button" type="button" title="Bài trước" aria-label="Bài trước">⏮</button>
        <button id="toggle-button" type="button" title="Phát / Dừng" aria-label="Phát hoặc dừng">⏯</button>
        <button id="next-button" type="button" title="Bài sau" aria-label="Bài sau">⏭</button>
        <button id="shuffle-button" type="button" title="Trộn danh sách một lần">🔀 Trộn</button>
        <button id="repeat-button" type="button" title="Đổi chế độ lặp">Lặp: tắt</button>
      </div>

      <h2 id="queue-title">Danh sách đang phát (0 bài)</h2>
      <p id="queue-empty" class="hint">Danh sách trống. Tải một playlist hoặc thêm bài từ kết quả tìm kiếm.</p>
      <ol id="queue-list" class="list"></ol>
    </section>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
