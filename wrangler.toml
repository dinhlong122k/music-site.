# Cấu hình Cloudflare Worker (KHÔNG phải Pages).
# Build của Cloudflare chạy `wrangler deploy`; file này cho nó biết đây là một Worker rõ ràng
# nên nó không còn chạy heuristic "Pages Functions" và không báo lỗi về thư mục static ở gốc.
name = "music-site"
main = "src/index.js"
compatibility_date = "2026-11-12"

# File tĩnh nằm trong ./public, phục vụ trực tiếp. Request không khớp file nào sẽ vào Worker
# (src/index.js) để định tuyến /api/*. Worker gọi lại static qua binding ASSETS.
[assets]
directory = "./public"
binding = "ASSETS"
